name: CI

on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Also check Python 3.13 and 3.14
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    name: Check code changes
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect code-affecting changes
        id: scope
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/ci_scope.py

  test:
    name: Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.full_matrix && '["3.12","3.13","3.14"]' || '["3.12"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run complete test collection (optional native may skip)
        run: uv run pytest tests

      - name: Run lint
        run: uv run ruff check .

      - name: Run type checking
        run: uv run mypy

      - name: Build distributions
        run: uv build
