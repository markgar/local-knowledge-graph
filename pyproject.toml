[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-knowledge-graph"
version = "0.1.0"
description = "Deterministic, evidence-backed retrieval over local Markdown corpora."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "knowledge-graph",
  "markdown",
  "sqlite",
  "local-first",
  "retrieval",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dependencies = [
  "markdown-it-py>=4,<5",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "sentence-transformers>=3.3,<6",
  "sqlite-vec>=0.1.9,<0.2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
graph = ["ladybug==0.20.4"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
kg = "kg.cli:app"

[project.urls]
Changelog = "https://github.com/markgar/local-knowledge-graph/blob/main/CHANGELOG.md"
Documentation = "https://github.com/markgar/local-knowledge-graph#readme"
Issues = "https://github.com/markgar/local-knowledge-graph/issues"
Repository = "https://github.com/markgar/local-knowledge-graph"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kg = ["schema.sql", "py.typed"]
"kg.evidence" = ["schema.sql"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kg"]
